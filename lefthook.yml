# Git hooks (lefthook). Local checkpoints stay fast: staged lint only.
# `pnpm verify` and CI own the full gate matrix (typecheck, tests, build,
# duplication, dead exports, structure, official baseline).
# Run `pnpm exec lefthook install` explicitly in a development checkout.
# Published packages must not execute development-only install hooks.
pre-commit:
  jobs:
    - name: worktree layout
      run: node scripts/verify-worktree-layout.mjs
    - name: lint (staged)
      glob: '*.{ts,tsx,mts,cts,mjs,cjs,js}'
      run: node_modules/.bin/oxlint --no-error-on-unmatched-pattern {staged_files}
