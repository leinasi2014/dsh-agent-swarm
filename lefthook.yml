# Git hooks (lefthook). Local checkpoints stay fast: staged lint only.
# Candidate and claim-triggered CI workflows own the wider gate matrix.
# Installed automatically on `pnpm install` via the postinstall script.
pre-commit:
  jobs:
    - name: lint (staged)
      glob: '*.{ts,tsx,mts,cts,mjs,cjs,js}'
      run: node_modules/.bin/oxlint --no-error-on-unmatched-pattern {staged_files}
