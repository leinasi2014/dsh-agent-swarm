# Bundle layer for the durable host-only Team orchestrator.
#
# Installation contributes one ENABLED-BY-DEFAULT structural group so a clean
# official Profile gets a usable Team surface and read path. Enabling the group
# never auto-creates a Team nor spawns members — the user must still explicitly
# create a Team. The child consumes the separately composed official storage
# hub, KV backend, Storage Domain and Session persistence; without those
# services the enabled child stays pending (fail closed). A Profile owner may
# still disable or reconfigure the group in a later patch layer.
- insert:
    - id: agent-swarm
      name: cordis:group
      group: true
      disabled: false
      config:
        - id: agent-swarm-runtime
          name: dsh-agent-swarm
          config:
            enabled: true
            memberProvider: spawn
            memberMaxDepth: 1
            schedulerProvider: priority-ready
            reviewProvider: manual
