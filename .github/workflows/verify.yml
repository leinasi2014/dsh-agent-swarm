# Ordinary candidate verification. Compatibility, coverage and promotion are
# claim-triggered lanes, not duplicate work on every pull request.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      proof_url:
        description: 'Controller-hosted immutable proof ZIP URL (optional; no fixture substitution)'
        type: string
        required: false
      proof_sha256:
        description: 'Controller-pinned ZIP SHA256'
        type: string
        required: false
      expected_sha256:
        description: 'Controller-pinned controller-expected.json SHA256 inside ZIP'
        type: string
        required: false
      accepted_verifier_ref:
        description: 'Optional independently accepted verifier commit (full SHA, different from candidate)'
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # PR runs retain the synthetic merge checkout. A receipt for PR head
        # cannot prove that merge. Dispatch/push receipts bind the actual HEAD.

      - name: Read external controller proof configuration
        shell: pwsh
        env:
          PROOF_URL: ${{ inputs.proof_url }}
          PROOF_SHA256: ${{ inputs.proof_sha256 }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          ACCEPTED_VERIFIER_REF: ${{ inputs.accepted_verifier_ref }}
        run: |
          $values = @($env:PROOF_URL, $env:PROOF_SHA256, $env:EXPECTED_SHA256, $env:ACCEPTED_VERIFIER_REF)
          if (($values | Where-Object { -not [string]::IsNullOrEmpty($_) }).Count -eq 0) {
            Write-Host 'P0 managed-Team product proof: NOT_CONFIGURED (no external controller receipt)'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:PROOF_URL) -or $env:PROOF_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or $env:EXPECTED_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Partial or invalid controller proof configuration'
          }
          if ($env:ACCEPTED_VERIFIER_REF -and ($env:ACCEPTED_VERIFIER_REF -cnotmatch '^[0-9a-f]{40}$' -or $env:ACCEPTED_VERIFIER_REF -eq (git rev-parse HEAD))) {
            throw 'Accepted verifier must be an external fixed commit, not the candidate itself'
          }
          $uri = [uri]$env:PROOF_URL
          if ($uri.Scheme -ne 'https') { throw 'Controller proof URL must use HTTPS' }
          $archive = Join-Path $env:RUNNER_TEMP 'p0-controller-proof.zip'
          $proofRoot = Join-Path $env:RUNNER_TEMP 'p0-controller-proof'
          Invoke-WebRequest -Uri $uri -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:PROOF_SHA256) { throw 'Controller ZIP digest mismatch' }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            foreach ($entry in $zip.Entries) {
              if ([IO.Path]::IsPathRooted($entry.FullName) -or ($entry.FullName -split '[/\\]' -contains '..')) { throw 'Controller ZIP path escapes proof root' }
            }
          } finally { $zip.Dispose() }
          Expand-Archive -LiteralPath $archive -DestinationPath $proofRoot
          "P0_PROOF_ROOT=$proofRoot" >> $env:GITHUB_ENV
          "P0_EXPECTED=$(Join-Path $proofRoot 'controller-expected.json')" >> $env:GITHUB_ENV
          "P0_EXPECTED_SHA256=$env:EXPECTED_SHA256" >> $env:GITHUB_ENV
          if (-not $env:ACCEPTED_VERIFIER_REF) { Write-Host 'Accepted-base acceptance: NOT_CONFIGURED (candidate consumption is not independent acceptance)' }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Candidate engineering gate
        # One targeted retry for the known upstream flake: the official
        # dsh-session-persistence-jsonl Win32 mkdir/rename race fails with
        # ENOENT on ".dsh-mkdir-*" temp dirs (recorded in the M1C exit
        # report §3.1). Any OTHER failure fails immediately — this is a
        # signature-scoped retry, not a blanket mask. Output is captured to
        # a file and re-emitted: vitest worker stderr does not reliably
        # surface through Tee-Object variable capture, which silently
        # disabled the signature match on 2026-08-20 (three missed retries).
        shell: pwsh
        run: |
          pwsh -NoProfile -Command "pnpm verify:candidate" *> verify-gate.log
          $code = $LASTEXITCODE
          Get-Content verify-gate.log
          if ($code -eq 0) { exit 0 }
          if (-not (Select-String -Path verify-gate.log -Pattern '\.dsh-mkdir-' -Quiet)) { exit $code }
          Write-Host "::warning::verified-flake signature .dsh-mkdir detected; retrying the gate once"
          pwsh -NoProfile -Command "pnpm verify:candidate" *> verify-gate.log
          $code = $LASTEXITCODE
          Get-Content verify-gate.log
          exit $code

      - name: Load explicitly accepted verifier
        if: inputs.accepted_verifier_ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted_verifier_ref }}
          path: accepted-verifier

      - name: Independently accepted verifier consumes candidate receipt
        if: inputs.accepted_verifier_ref != ''
        shell: pwsh
        env:
          P0_EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          $proofRoot = Join-Path $env:RUNNER_TEMP 'p0-controller-proof'
          node accepted-verifier/scripts/verify-p0-profile-proof.mjs --candidate --candidate-repo "$env:GITHUB_WORKSPACE" --root "$proofRoot" --expected "$(Join-Path $proofRoot 'controller-expected.json')" --expected-sha256 "$env:P0_EXPECTED_SHA256"
