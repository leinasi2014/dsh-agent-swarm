# Full gate matrix. Local lefthook hooks stay fast; this workflow owns the
# complete verification: pinned reference checkouts, the official evidence
# checkout (network-verified), pnpm verify (structure, lint, duplication,
# dead exports, typecheck, tests, build, artifact), Gate A official-baseline
# verification and a coverage report.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize pinned reference checkouts
        run: |
          pwsh ./ref/dsh-agent-teams/sync-reference.ps1
          pwsh ./ref/jiuwenswarm/sync-reference.ps1

      - name: Materialize official evidence checkout
        run: pwsh ./scripts/sync-official-evidence.ps1 -Target "${{ runner.temp }}/official-evidence"

      - name: Full verify gate
        # One targeted retry for the known upstream flake: the official
        # dsh-session-persistence-jsonl Win32 mkdir/rename race fails with
        # ENOENT on ".dsh-mkdir-*" temp dirs (recorded in the M1C exit
        # report §3.1). Any OTHER failure fails immediately — this is a
        # signature-scoped retry, not a blanket mask. Output is captured to
        # a file and re-emitted: vitest worker stderr does not reliably
        # surface through Tee-Object variable capture, which silently
        # disabled the signature match on 2026-08-20 (three missed retries).
        shell: pwsh
        run: |
          pwsh -NoProfile -Command "pnpm verify" *> verify-gate.log
          $code = $LASTEXITCODE
          Get-Content verify-gate.log
          if ($code -eq 0) { exit 0 }
          if (-not (Select-String -Path verify-gate.log -Pattern '\.dsh-mkdir-' -Quiet)) { exit $code }
          Write-Host "::warning::verified-flake signature .dsh-mkdir detected; retrying the gate once"
          pwsh -NoProfile -Command "pnpm verify" *> verify-gate.log
          $code = $LASTEXITCODE
          Get-Content verify-gate.log
          exit $code

      - name: Gate A official baseline (live remote)
        run: pnpm verify:official
        env:
          DSH_OFFICIAL_CHECKOUT: ${{ runner.temp }}/official-evidence

      - name: Coverage report
        # Same signature-scoped retry as the gate: coverage re-runs vitest,
        # so the official .dsh-mkdir Win32 race can strike here too (hit on
        # 2026-08-21 after a fully green gate run).
        shell: pwsh
        run: |
          pwsh -NoProfile -Command "pnpm test:coverage" *> coverage-gate.log
          $code = $LASTEXITCODE
          Get-Content coverage-gate.log
          if ($code -eq 0) { exit 0 }
          if (-not (Select-String -Path coverage-gate.log -Pattern '\.dsh-mkdir-' -Quiet)) { exit $code }
          Write-Host "::warning::verified-flake signature .dsh-mkdir detected in coverage; retrying once"
          pwsh -NoProfile -Command "pnpm test:coverage" *> coverage-gate.log
          $code = $LASTEXITCODE
          Get-Content coverage-gate.log
          exit $code
