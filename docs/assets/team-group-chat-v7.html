function renderMentions(){if(!mention)return;mentionMenu.innerHTML=mention.names.length?mention.names.map((n,i)=>`<button type="button" role="option" id="tg-mention-${i}" class="tg-mention-option" data-choose-mention="${n}" aria-selected="${i===activeOption}"><span class="tg-avatar ${faceClass(n)}">${n.slice(-1)}</span><span class="tg-mention-description"><strong>${n}</strong><span class="tg-muted"> · ${people[n].job}</span></span><span class="tg-vision-label">${visionLabel(n)}</span></button>`).join(''):'<div class="tg-mention-empty">没有匹配的本队成员</div>';mentionMenu.hidden=false;if(mention.names.length)input.setAttribute('aria-activedescendant',`tg-mention-${activeOption}`);else input.removeAttribute('aria-activedescendant');}
function detectMention(){if(composing||state.chat!=='group'){closeMentions();return;}const sel=window.getSelection();if(!sel?.rangeCount||!sel.isCollapsed){closeMentions();return;}const r=sel.getRangeAt(0),node=r.startContainer;if(node.nodeType!==Node.TEXT_NODE||!input.contains(node)||node.parentElement.closest('[data-member-id]')){closeMentions();return;}const before=node.textContent.slice(0,r.startOffset),start=mentionStart(before),query=before.slice(start+1);if(start<0||/[\s@]/u.test(query)||query.length>40){closeMentions();return;}const range=r.cloneRange();range.setStart(node,start);mention={range,names:agentNames.filter(n=>(n+' '+people[n].job).includes(query))};activeOption=0;renderMentions();}
function chooseMention(name){if(!mention||!mention.names.includes(name))return;const r=mention.range,token=document.createElement('span');token.className='tg-mention-token';token.contentEditable='false';token.dataset.memberId=people[name].id;token.textContent='@'+name;r.deleteContents();r.insertNode(token);const space=document.createTextNode('\u00a0');token.after(space);const next=document.createRange();next.setStart(space,1);next.collapse(true);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(next);input.focus();closeMentions();saveDraft();updateDraftHint();}
function insertPlainText(text){input.focus();const sel=window.getSelection();if(!sel?.rangeCount)return;let range=sel.getRangeAt(0);if(!input.contains(range.commonAncestorContainer)){range=document.createRange();range.selectNodeContents(input);range.collapse(false);}range.deleteContents();const node=document.createTextNode(text);range.insertNode(node);range.setStartAfter(node);range.collapse(true);sel.removeAllRanges();sel.addRange(range);saveDraft();detectMention();updateDraftHint();}
function renderAttachments(){root.querySelector('#tg-attachments').innerHTML=draft().images.map(i=>`<div class="tg-attach-item">${i.phase==='ready'?`<img src="${i.data}" alt="${esc(i.name)}">`:`<div class="tg-attach-placeholder">${i.phase==='failed'?'读取失败':'读取中…'}</div>`}<button type="button" class="tg-attach-remove" data-remove-image="${i.id}" aria-label="移除${esc(i.name)}">×</button><span class="tg-attach-name">${esc(i.name)}</span>${i.phase==='failed'?`<button type="button" class="tg-attach-retry" data-retry-image="${i.id}">重试</button>`:'<span class="tg-notice">仅本地预览</span>'}</div>`).join('');}
function readImage(item,owner){item.phase='reading';const reader=new FileReader();const refresh=()=>{if(state.chat===owner){renderAttachments();updateDraftHint();}};reader.onload=()=>{const probe=new Image();probe.onload=()=>{item.data=String(reader.result);item.phase='ready';refresh();};probe.onerror=()=>{item.phase='failed';refresh();};probe.src=String(reader.result);};reader.onerror=()=>{item.phase='failed';refresh();};reader.readAsDataURL(item.file);refresh();}
function addImages(files,owner=state.chat){const d=draft(owner);for(const file of files){if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)){d.notice='本版仅接收 PNG、JPEG、WebP、GIF 图片。';continue;}const item={id:String(++imageCounter),file,name:file.name||'粘贴的图片',phase:'reading',data:''};d.images.push(item);readImage(item,owner);}if(state.chat===owner){root.querySelector('#tg-delivery').textContent=d.notice||'图片仅在本地预览；真实上传流程另行实现。';renderAttachments();updateDraftHint();}}
function submitDraft(){saveDraft();updateDraftHint();if(root.querySelector('#tg-send').disabled)return;const owner=state.chat,d=draft(owner),entry={text:input.innerText.trim(),names:targets(),images:d.images.map(i=>({name:i.name,data:i.data}))};if(!extras.has(owner))extras.set(owner,[]);extras.get(owner).push(entry);drafts.set(owner,{html:'',images:[],notice:'已添加到本地预览，等待处理；未调用模型或发送到真实团队。'});closeMentions();renderChat();input.focus();}
function render(){saveDraft();closeProfile();closeMentions();root.style.setProperty('--tg-aside',`${state.aside}px`);root.style.setProperty('--tg-space',state.density==='紧凑'?'12px':'18px');root.dataset.taskStyle=state.taskStyle==='分隔线'?'lines':'cards';renderChat();renderSide();renderFolds();adaptLayout();}
root.addEventListener('pointerdown',e=>{if(e.target.closest('[data-choose-mention]'))e.preventDefault();});
root.addEventListener('click',e=>{
 const b=e.target.closest('button');
 if(e.target.hasAttribute('data-profile-mask')){closeProfile(true);return;}
 if(!e.target.closest('#tg-profile')&&!b?.dataset.person)closeProfile();
 if(!e.target.closest('.tg-compose-box'))closeMentions();
 if(!b)return;
 if(b.hasAttribute('data-nav-toggle')){state.nav=!state.nav;renderFolds();}
 if(b.dataset.fold){state.folds[b.dataset.fold]=!state.folds[b.dataset.fold];renderFolds();}
 if(b.dataset.chat){saveDraft();if(state.chat!==b.dataset.chat){state.chat=b.dataset.chat;renderChat();}if(b.dataset.fold)b.focus();else input.focus();}
 if(b.dataset.side){state.side=b.dataset.side;renderSide();adaptLayout();}
 if(b.hasAttribute('data-open-panel')){state.drawer=true;adaptLayout();root.querySelector(`.tg-right-tabs [data-side="${state.side}"]`)?.focus();}
 if(b.hasAttribute('data-close-panel')){state.drawer=false;adaptLayout();root.querySelector('[data-open-panel]')?.focus();}
 if(b.dataset.person){if(state.person===b.dataset.person){closeProfile();return;}state.person=b.dataset.person;state.detail='属性';profileTrigger=b;renderProfile();root.querySelector('#tg-profile-title').focus();}
 if(b.dataset.detail){state.detail=b.dataset.detail;renderProfile();root.querySelector(`[data-detail="${state.detail}"]`)?.focus();}
 if(b.hasAttribute('data-close-profile'))closeProfile(true);
 if(b.dataset.task){closeProfile();state.task=b.dataset.task;state.taskView=b.dataset.initialView||'overview';state.artifact=false;state.taskNotice='';state.requestOpen=false;state.side='tasks';state.drawer=true;renderSide();adaptLayout();root.querySelector('[data-task-back]')?.focus();}
 if(b.dataset.taskView){state.taskView=b.dataset.taskView;renderSide();root.querySelector(`.tg-task-view-tabs [data-task-view="${state.taskView}"]`)?.focus();}
 if(b.hasAttribute('data-artifact-toggle')){state.artifact=!state.artifact;renderSide();root.querySelector('[data-artifact-toggle]')?.focus();}
 if(b.hasAttribute('data-show-artifact')){state.taskView='overview';state.artifact=true;renderSide();root.querySelector('[data-artifact-toggle]')?.focus();}
 if(b.hasAttribute('data-task-back'))returnToTasks();
 if(b.hasAttribute('data-request-task')){state.requestOpen=true;state.task='';renderSide();root.querySelector('#tg-request-title')?.focus();}
 if(b.dataset.askAssignment){const t=tasks.find(t=>t.id===b.dataset.askAssignment);if(t){if(!extras.has('group'))extras.set('group',[]);extras.get('group').push({text:`请队长安排：${t.title}`,names:['北辰'],images:[]});state.taskNotice='已向队长提出安排请求（本地预览），任务仍未分配。';saveDraft();renderChat();renderSide();root.querySelector('[data-ask-assignment]')?.focus();}}
 if(b.hasAttribute('data-goal-open')){state.goalOpen=!state.goalOpen;renderGoal();root.querySelector('[data-goal-open]')?.focus();}
 if(b.hasAttribute('data-goal-toggle-run')){state.goalPaused=!state.goalPaused;renderGoal();renderSide();root.querySelector('[data-goal-toggle-run]')?.focus();}
 if(b.hasAttribute('data-goal-edit')){state.goalEdit=true;goalDraft={...goal};renderGoal();root.querySelector('#tg-goal-text')?.focus();}
 if(b.hasAttribute('data-goal-cancel')){state.goalEdit=false;renderGoal();root.querySelector('[data-goal-edit]')?.focus();}
 if(b.dataset.chooseMention)chooseMention(b.dataset.chooseMention);
 if(b.hasAttribute('data-add-image')){pickerOwner=state.chat;root.querySelector('#tg-files').click();}
 if(b.dataset.removeImage){draft().images=draft().images.filter(i=>i.id!==b.dataset.removeImage);renderAttachments();updateDraftHint();}
 if(b.dataset.retryImage){const item=draft().images.find(i=>i.id===b.dataset.retryImage);if(item)readImage(item,state.chat);}
});
function returnToTasks(){const previous=state.task;state.task='';state.requestOpen=false;state.taskNotice='';renderSide();const row=root.querySelector(`.tg-right [data-task="${previous}"]`);if(row?.closest('details'))row.closest('details').open=true;(row||root.querySelector('[data-request-task]'))?.focus();}
root.addEventListener('input',e=>{const el=e.target;if(el.closest('#tg-request-form')){el.setCustomValidity('');requestDraft[el.name]=el.value;}if(el.closest('#tg-goal-form')){el.setCustomValidity('');goalDraft[el.name]=el.value;}});
root.addEventListener('toggle',e=>{const el=e.target;if(el.dataset.traceRound)state.roundOpen[el.dataset.traceRound]=el.open;if(el.hasAttribute('data-task-history'))state.historyOpen=el.open;},true);
function submitWorkRequest(){const form=root.querySelector('#tg-request-form');if(!form?.reportValidity())return;const title=requestDraft.title.trim();if(!title){const field=root.querySelector('#tg-request-title');field.setCustomValidity('请填写希望团队完成的工作。');field.reportValidity();return;}requests.push({title,criteria:requestDraft.criteria.trim()});if(!extras.has('group'))extras.set('group',[]);extras.get('group').push({text:`提出任务：${title}${requestDraft.criteria.trim()?'\n完成标准：'+requestDraft.criteria.trim():''}`,names:['北辰'],images:[]});requestDraft.title='';requestDraft.criteria='';state.requestOpen=false;saveDraft();renderChat();renderSide();root.querySelector('[data-request-task]')?.focus();}
function saveGoalAdjustment(){const form=root.querySelector('#tg-goal-form');if(!form?.reportValidity())return;for(const name of ['text','criteria']){if(!goalDraft[name].trim()){const field=form.elements.namedItem(name);field.setCustomValidity('此项不能为空。');field.reportValidity();return;}}Object.assign(goal,Object.fromEntries(Object.entries(goalDraft).map(([k,v])=>[k,v.trim()])));state.goalEdit=false;state.goalChanged=true;renderGoal();root.querySelector('[data-goal-edit]')?.focus();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-submit-request'))submitWorkRequest();if(b.hasAttribute('data-save-goal'))saveGoalAdjustment();if(b.hasAttribute('data-send-chat')&&!composing)submitDraft();});
root.addEventListener('submit',e=>{if(e.target.id==='tg-request-form'){e.preventDefault();submitWorkRequest();}if(e.target.id==='tg-goal-form'){e.preventDefault();saveGoalAdjustment();}});
input.addEventListener('compositionstart',()=>{composing=true;closeMentions();});
input.addEventListener('compositionend',()=>{composing=false;saveDraft();detectMention();updateDraftHint();});
input.addEventListener('input',()=>{if(!input.innerText.trim()&&!input.querySelector('[data-member-id]'))input.innerHTML='';saveDraft();detectMention();updateDraftHint();});
input.addEventListener('keyup',e=>{if(!['ArrowUp','ArrowDown','Enter','Escape'].includes(e.key))detectMention();});
input.addEventListener('keydown',e=>{if(composing||e.isComposing)return;if(mention){if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const count=mention.names.length;if(count)activeOption=(activeOption+(e.key==='ArrowDown'?1:-1)+count)%count;renderMentions();return;}if(e.key==='Enter'){e.preventDefault();if(mention.names[activeOption])chooseMention(mention.names[activeOption]);return;}if(e.key==='Escape'){e.preventDefault();closeMentions();return;}}if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();submitDraft();}});
input.addEventListener('paste',e=>{e.preventDefault();const files=Array.from(e.clipboardData?.files||[]);if(files.length)addImages(files);else insertPlainText(e.clipboardData?.getData('text/plain')||'');});
root.querySelector('#tg-files').addEventListener('change',e=>{addImages(Array.from(e.target.files),pickerOwner);e.target.value='';});
const composer=root.querySelector('#tg-composer');
composer.addEventListener('dragover',e=>{e.preventDefault();composer.classList.add('tg-drag');});
composer.addEventListener('dragleave',e=>{if(!composer.contains(e.relatedTarget))composer.classList.remove('tg-drag');});
composer.addEventListener('drop',e=>{e.preventDefault();composer.classList.remove('tg-drag');const files=Array.from(e.dataTransfer.files);if(files.length)addImages(files);else insertPlainText(e.dataTransfer.getData('text/plain'));});
composer.addEventListener('submit',e=>{e.preventDefault();if(!composing)submitDraft();});
root.addEventListener('keydown',e=>{if(e.defaultPrevented)return;if(e.key==='Escape'){if(state.person){e.preventDefault();closeProfile(true);}else if(state.drawer){e.preventDefault();state.drawer=false;adaptLayout();root.querySelector('[data-open-panel]')?.focus();}else if(state.nav&&root.clientWidth<=500){e.preventDefault();state.nav=false;renderFolds();root.querySelector('[data-nav-toggle]').focus();}}});
root.querySelector('#tg-profile').addEventListener('keydown',e=>{const tabs=['属性','工作','能力','成果'];if(e.target.matches('[data-detail]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const i=tabs.indexOf(state.detail);state.detail=tabs[e.key==='Home'?0:e.key==='End'?3:(i+(e.key==='ArrowRight'?1:3))%4];renderProfile();root.querySelector(`[data-detail="${state.detail}"]`).focus();}if(e.key==='Tab'&&root.clientWidth<=500){const card=root.querySelector('#tg-profile'),items=[...card.querySelectorAll('button:not([disabled]),summary,[tabindex="0"]')].filter(el=>el.getClientRects().length),first=items[0],last=items.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement.id==='tg-profile-title')){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
document.addEventListener('focusin',e=>{if(!state.person||root.querySelector('#tg-profile').contains(e.target)||profileTrigger?.contains(e.target))return;if(root.clientWidth<=500)root.querySelector('#tg-profile-title')?.focus();else closeProfile();});
window.addEventListener('scroll',positionProfile,true);
window.addEventListener('resize',positionProfile);
window.visualViewport?.addEventListener('resize',positionProfile);
window.visualViewport?.addEventListener('scroll',positionProfile);
new ResizeObserver(positionProfile).observe(root.querySelector('#tg-profile'));
new ResizeObserver(adaptLayout).observe(root);
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(state,'taskStyle',{label:'任务行样式',options:['浅边框','分隔线']});tweak.addSelect(state,'density',{label:'消息密度',options:['标准','紧凑']});tweak.addSlider(state,'aside',{label:'团队栏宽度',min:300,max:360,step:10,unit:'px'});}
})();
</script>
